        <h1>Bilgi Yarışmasına Hoşgeldiniz</h1>

        <button id="mavi">Yarışmaya Başlayın</button>
    </div>

    <div class="kutu" id="soruKutusu">

        <button>Alanya</button>

    <div class="gurur-tablomuz">

        <table>
            <tr>
                <th>Öğrenci</th>
                <th>Doğru</th>
                <th>Yanlış</th>

            </tr>
            <tr>
                <td>Hamdi</td>
                <td>0</td>
